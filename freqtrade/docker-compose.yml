# Panel multi-bots en FAUX WALLET (dry-run) : aucun ordre réel n'est envoyé.
# Lancer :   docker compose up -d
# Panel :    http://localhost:8081  (FreqUI) puis ajouter les autres bots 8082..8085
x-bot: &bot
  image: freqtradeorg/freqtrade:stable
  restart: unless-stopped
  volumes:
    - "./user_data:/freqtrade/user_data"

services:
  trendregime-x2:
    <<: *bot
    container_name: za-trendregime-x2
    ports:
      - "127.0.0.1:8081:8080"
    command: >
      trade --logfile /freqtrade/user_data/logs/trendregime-x2.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/bots/trendregime-x2.json

  trendregime-x5:
    <<: *bot
    container_name: za-trendregime-x5
    ports:
      - "127.0.0.1:8082:8080"
    command: >
      trade --logfile /freqtrade/user_data/logs/trendregime-x5.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/bots/trendregime-x5.json

  supertrend-x3:
    <<: *bot
    container_name: za-supertrend-x3
    ports:
      - "127.0.0.1:8083:8080"
    command: >
      trade --logfile /freqtrade/user_data/logs/supertrend-x3.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/bots/supertrend-x3.json

  momentum-x3:
    <<: *bot
    container_name: za-momentum-x3
    ports:
      - "127.0.0.1:8084:8080"
    command: >
      trade --logfile /freqtrade/user_data/logs/momentum-x3.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/bots/momentum-x3.json

  meanrev-x3:
    <<: *bot
    container_name: za-meanrev-x3
    ports:
      - "127.0.0.1:8085:8080"
    command: >
      trade --logfile /freqtrade/user_data/logs/meanrev-x3.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/bots/meanrev-x3.json
